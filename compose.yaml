name: golang-mysql
services:
  db:
    container_name: mysql
    hostname: mysql
    image: mysql
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=TJAKSIC_TEST_DB
      - MYSQL_ROOT_PASSWORD=secret
    ports:
      - '3306:3306'
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10
    networks:
      - app-network
  golang:
    container_name: golang-app
    hostname: golang-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '8080:8080'
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
volumes:
  db:
    driver: local
networks:
  app-network:
    driver: bridge